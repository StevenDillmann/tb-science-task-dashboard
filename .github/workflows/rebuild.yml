name: Rebuild & Deploy

on:
  # Primary: fired by the upstream repo (terminal-bench-science) the moment a
  # PR / discussion / review / label changes — see its notify-dashboard.yml.
  repository_dispatch:
    types: [upstream-changed]
  # Backup: a slow safety-net poll in case an upstream event is ever missed.
  # (GitHub heavily throttles short cron intervals, so a tight */15 isn't
  # honoured anyway — hourly is what it reliably runs.)
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Queue rebuilds, never cancel mid-flight: cancelling a Pages deploy in
  # progress can leave it half-applied. Bursts are already debounced upstream
  # (notify-dashboard), and rebuilds are idempotent (last one wins).
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Raw-node cache persisted across runs. It lets the fetch (a) fall back to
      # the last good data when the GitHub API is down instead of freezing the
      # site, and (b) pull only what changed. A unique key per run always saves a
      # fresh entry; restore-keys grabs the most recent prior one. A cache miss
      # is harmless — the fetch just does a full pull and self-heals.
      - name: Restore raw-node cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: rawcache-${{ github.run_id }}
          restore-keys: |
            rawcache-

      - name: Fetch upstream PRs + proposals
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Event-driven rebuilds re-read only the open PRs whose updatedAt
          # moved (plus every PR's checks); the hourly cron re-reads them all,
          # so anything an update didn't bump is repaired within the hour.
          DASHBOARD_FULL_REFRESH: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python3 scripts/fetch_data.py --out public/data.json --cache .cache/raw.json

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Frozen-origin failure, seen 2026-08-16 (6.5h) and 2026-11-12 (13:33 to
  # 17:10 UTC): every deploy reported `success` in ~15s while the site kept
  # serving one old deploy, cache-busted requests included. Distinct from the
  # stall pages-watchdog.yml handles, where deploys hang at `queued` instead.
  # Both times every deploy carried the same build version: deploy-pages uses
  # $GITHUB_SHA, and a data refresh needs no commit, so dozens of deploys a
  # day share one deployment ID. On 11-12 a new commit (a fresh ID) unfroze
  # it at once, which confirms the cause.
  #
  # So this calls the Pages deployment API itself, the same requests
  # deploy-pages makes, with a per-run build version. deploy-pages takes no
  # input for it, a step-level `env: GITHUB_SHA` is ignored (tried in
  # 637b573), and the API 404s a version that is not a commit in the repo
  # (tried in 7b87ed6). So each run makes its own commit object: HEAD's tree,
  # HEAD as parent, on no branch, so no history changes. If that fails the
  # step falls back to the plain sha, which is deploy-pages' behaviour.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # create the per-run commit object (no ref is updated)
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            let version = context.sha
            try {
              const { data: head } = await github.rest.git.getCommit({ owner, repo, commit_sha: context.sha })
              const { data: c } = await github.rest.git.createCommit({ owner, repo, tree: head.tree.sha,
                parents: [context.sha],
                message: `pages deploy: run ${context.runId} attempt ${process.env.GITHUB_RUN_ATTEMPT}` })
              version = c.sha
            } catch (e) {
              core.warning(`per-run commit failed (${e.message}); deploying as ${context.sha}`)
            }
            const { data: arts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: context.runId, name: 'github-pages' })
            const artifact = arts.artifacts.find(a => a.name === 'github-pages')
            if (!artifact) return core.setFailed('no github-pages artifact in this run')
            const { data: dep } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo, artifact_id: artifact.id, pages_build_version: version,
              oidc_token: await core.getIDToken() })
            core.info(`Created Pages deployment ${version}`)
            const id = dep.id || dep.status_url.split('/').pop()
            const failed = ['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']
            const deadline = Date.now() + 10 * 60 * 1000
            while (Date.now() < deadline) {
              await new Promise(r => setTimeout(r, 5000))
              const { data: st } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { owner, repo, id })
              if (st.status === 'succeed') {
                core.setOutput('page_url', dep.page_url)
                return core.info(`Deployed ${dep.page_url}`)
              }
              if (failed.includes(st.status)) return core.setFailed(`Pages deployment ${version}: ${st.status}`)
            }
            core.setFailed(`Pages deployment ${version} did not finish within 10 min`)
